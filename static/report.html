<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota Rescue - Monthly report</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>Monthly hours and pay</h1><div class="row"><a href="/static/manager.html">Back</a></div></header>
  <main>
    <div id="msg" class="msg"></div>
    <div class="card row">
      Month: <input id="month" type="month" onchange="load()">
      Hourly rate: <input id="rate" type="number" style="width:110px"> <span id="cur"></span>
      <button class="light" onclick="saveRate()">Save rate</button>
      <button onclick="downloadCsv()">Download CSV</button>
    </div>
    <div class="card">
      <p class="muted">Gross pay = hours x one hourly rate. Sick days count 0 hours. No overtime or tax.
        Today's hours appear after the manager presses "Close day".</p>
      <div style="overflow-x:auto"><table id="table"></table></div>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script>
    const monthEl = document.getElementById("month");
    monthEl.value = new Date().toISOString().slice(0, 7);

    async function load() {
      const d = await api("/api/report?month=" + monthEl.value);
      document.getElementById("rate").value = d.hourly_rate;
      document.getElementById("cur").textContent = d.currency;
      const fmt = n => Number(n).toLocaleString();
      const totalH = d.rows.reduce((a, r) => a + r.hours, 0), totalP = d.rows.reduce((a, r) => a + r.gross_pay, 0);
      document.getElementById("table").innerHTML =
        `<tr><th>Name</th><th>Shifts</th><th>Cover</th><th>Sick</th><th>Hours</th><th>Gross pay (${d.currency})</th></tr>` +
        d.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.shifts}</td><td>${r.cover_shifts}</td><td>${r.sick_days}</td>
          <td>${r.hours}</td><td>${fmt(r.gross_pay)}</td></tr>`).join("") +
        `<tr><th>Total</th><th></th><th></th><th></th><th>${fmt(totalH)}</th><th>${fmt(totalP)}</th></tr>`;
    }

    async function saveRate() {
      await api("/api/settings", { key: "hourly_rate", value: document.getElementById("rate").value });
      showMsg("Rate saved."); load();
    }

    function downloadCsv() { location.href = "/api/report.csv?month=" + monthEl.value; }

    load();
  </script>
</body>
</html>
