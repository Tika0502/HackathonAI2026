<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota Rescue - My shifts</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1 id="hello">Rota Rescue</h1><button onclick="logout()">Log out</button></header>
  <main style="max-width:560px">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2>Inbox</h2>
      <div id="inbox" class="muted">Loading...</div>
    </div>

    <div class="card">
      <h2>My shifts</h2>
      <div id="shifts" class="muted">Loading...</div>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script>
    let seenOffers = new Set();
    let seenMessages = new Set();
    let firstLoad = true;

    async function loadShifts() {
      const rows = await api("/api/my-shifts");
      document.getElementById("shifts").innerHTML = rows.length ? rows.map(s => `
        <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee">
          <div><b>${esc(s.date)}</b> ${esc(s.shift_name)} ${esc(s.start)}-${esc(s.end)}
            ${s.is_replacement ? '<span class="pill">cover</span>' : ""}
            <span class="pill ${s.status}">${s.status}</span></div>
          ${s.status === "working" ? `<button class="no" onclick="reportSick(${s.id})">Report sick / can't come</button>` : ""}
        </div>`).join("") : "No upcoming shifts.";
    }

    async function reportSick(id) {
      if (!confirm("Report sick for this shift? We will find someone to cover it.")) return;
      await api("/api/report-sick", { assignment_id: id });
      showMsg("Get well soon! We are finding someone to cover your shift.");
      loadShifts();
    }

    async function loadInbox() {
      const data = await api("/api/inbox");
      const box = document.getElementById("inbox");
      // Messages (e.g. "your shift is cancelled"): each one notifies only once.
      const msgs = data.messages.map(m => {
        if (!seenMessages.has(m.id) && !firstLoad) notify("Rota Rescue", m.text);
        seenMessages.add(m.id);
        return `<div class="offer" style="border-color:#ffcdd2">${esc(m.text)}
                <div class="muted">${esc(m.time.slice(5, 16))}</div></div>`;
      }).join("");
      const offers = data.offers.map(o => {
        const isNew = !seenOffers.has(o.id);
        seenOffers.add(o.id);
        if (isNew && !firstLoad && o.status === "waiting")
          notify("New shift offer", `${o.shift_name} ${o.date} ${o.start}-${o.end}`);
        if (o.status === "waiting") return `
          <div class="offer">
            <b>Can you work ${esc(o.shift_name)} on ${esc(o.date)}, ${esc(o.start)}-${esc(o.end)}?</b>
            <p class="muted">Please answer within ${data.timeout_minutes} minutes.</p>
            <div class="row">
              <button class="yes" onclick="answer(${o.id}, 'yes')">Accept</button>
              <button class="no" onclick="answer(${o.id}, 'no')">Decline</button>
            </div>
          </div>`;
        const text = { yes: "You accepted. Booked!", no: "You declined.", timeout: "No answer in time.",
                       cancelled: "No longer needed, thanks.", too_late: "Already filled, thanks anyway!" }[o.status];
        return `<div style="padding:6px 0" class="muted">${esc(o.date)} ${esc(o.start)}-${esc(o.end)}:
                <span class="pill ${o.status}">${o.status}</span> ${esc(text)}</div>`;
      }).join("");
      box.innerHTML = msgs + offers || "No offers yet.";
      firstLoad = false;
    }

    async function answer(id, ans) {
      try {
        const r = await api("/api/answer", { offer_id: id, answer: ans });
        showMsg(r.message);
      } catch (e) { showMsg(e.message); }
      loadInbox(); loadShifts();
    }

    function notify(title, body) {
      if ("Notification" in window && Notification.permission === "granted")
        new Notification(title, { body });
    }

    (async () => {
      const me = await api("/api/me");
      document.getElementById("hello").textContent = "Hi, " + me.name.split(" ")[0];
      if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
      loadShifts(); loadInbox();
      setInterval(loadInbox, 3000);   // inbox refreshes every 3 seconds
      setInterval(loadShifts, 10000);
    })();
  </script>
</body>
</html>
